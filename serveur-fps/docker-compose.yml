# Déploiement sur le VPS (derrière Traefik de Dokploy) :
#   cd /opt/pdj-fps/serveur-fps && docker compose up -d --build
# Le conteneur n'expose aucun port sur l'hôte : Traefik le joint par le réseau dokploy-network
# (route fichier /etc/dokploy/traefik/dynamic/pdj-fps.yml, cf. README.md).
services:
  pdj-fps:
    container_name: pdj-fps
    build:
      context: ..
      dockerfile: serveur-fps/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      # origines autorisées pour le WebSocket, séparées par des virgules (vide = toutes)
      ORIGINES: "${ORIGINES:-}"
      # statistiques du Battle Royale, sur le volume nommé ci-dessous
      PDJ_FPS_BR_STATS: /donnees/stats-br.json
      # cinquante amis derrière l'IP d'un même bureau (le défaut du serveur reste 24)
      PDJ_FPS_CONNEXIONS_IP: "60"
    volumes:
      - pdj-fps-donnees:/donnees
    # un cœur entier : sous 0,3 vCPU (quota CFS de 30 ms par 100 ms), le moindre pic de calcul (création d'une salle, partie de zombies
    # chargée) gelait le processus 3 fois plus longtemps, pour toutes les salles à la fois ; 512 Mo pour trois salles dont un Battle Royale
    # à 50 joueurs (à MESURER après le déploiement : /sante.ticMaxMs, docker stats)
    mem_limit: 512m
    cpus: 1
    networks:
      - dokploy-network

# Ne jamais `docker compose down -v` : le volume porte les TOP 1 du Battle Royale.
volumes:
  pdj-fps-donnees:

networks:
  dokploy-network:
    external: true
